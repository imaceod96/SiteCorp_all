# =============================================================================
# SITECORP — CONFIGURACIÓN NGINX HTTPS / TLS 1.3 PARA VPS ETECSA
# =============================================================================

limit_req_zone $binary_remote_addr zone=sitecorp_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sitecorp_api_limit:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sitecorp.cu www.sitecorp.cu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sitecorp.cu www.sitecorp.cu;

    # Certificados TLS (Let's Encrypt / PKI Corporativa)
    ssl_certificate     /etc/letsencrypt/live/sitecorp.cu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitecorp.cu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de endurecimiento HTTP
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';" always;

    # Límite de tamaño de payload para subidas de Storage
    client_max_body_size 50m;

    # Frontend estático compilado (Vite SPA)
    root /var/www/sitecorp/dist;
    index index.html;

    # Rutas críticas de autenticación con rate limiting reforzado
    location ~ ^/api/v1/auth/(login|refresh|activate|recover-password|reset-password) {
        limit_req zone=sitecorp_auth_limit burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API autónoma de dominio, submódulos y Storage
    location /api/v1/ {
        limit_req zone=sitecorp_api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
