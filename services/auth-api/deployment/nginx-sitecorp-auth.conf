# =============================================================================
# SITECORP AUTH API — CONFIGURACIÓN DE REFERENCIA NGINX HTTPS REVERSE PROXY
# =============================================================================
# Destinado al proxy inverso en VPS (ETECSA o equivalente).
# Reenvía peticiones TLS a http://127.0.0.1:4010 con cabeceras estrictas,
# amortiguación y rate limiting a nivel de capa de transporte.
# =============================================================================

# Zona de rate limiting a nivel de reverse proxy por IP de cliente
limit_req_zone $binary_remote_addr zone=sitecorp_auth_ip:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=sitecorp_login_ip:10m rate=3r/s;

# 1. Redirección forzosa de HTTP hacia HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name auth.sitecorp.cu;

    # Exclusivamente para validación ACME Let's Encrypt si aplica
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal HTTPS Seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.sitecorp.cu;

    # Certificados TLS (Let's Encrypt o corporativos)
    ssl_certificate /etc/letsencrypt/live/auth.sitecorp.cu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.sitecorp.cu/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/auth.sitecorp.cu/chain.pem;

    # Protocolos y Cifrados Modernos (TLSv1.2 y TLSv1.3 exclusivamente)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Parámetros de Sesión TLS
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Cabeceras de Seguridad HTTP Globales
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Límites de Tamaño de Petición (fail-closed contra peticiones gigantes)
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Timeouts Estrictos
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Logs de acceso y error aislados
    access_log /var/log/nginx/sitecorp_auth_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/sitecorp_auth_error.log warn;

    # Ocultar versión de Nginx
    server_tokens off;

    # Endpoint de Login (rate limiting restrictivo anti-fuerza bruta en proxy)
    location = /api/v1/auth/login {
        limit_req zone=sitecorp_login_ip burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Evitar buffering de Fastify en endpoints interactivos
        proxy_buffering off;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # Resto de Rutas de Autenticación y Administración
    location / {
        limit_req zone=sitecorp_auth_ip burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }
}
